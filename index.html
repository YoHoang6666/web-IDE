<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy:
      - script-src: Allow scripts from self and the Monaco Editor blob workers.
      - connect-src: Allow Tauri IPC (tauri://) and the Vite dev-server websocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' tauri: asset:;
        script-src 'self' blob: 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: asset: blob:;
        connect-src 'self' ipc: tauri: ws://localhost:5173;
        font-src 'self' data:;
        worker-src 'self' blob:;
      "
    />
    <title>web-IDE</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!--
      Root container — the entire UI is mounted here by main.ts.
      Layout tree:
        #app
        └── .ide-layout              (full viewport flex column)
            ├── .title-bar           (top status / menu bar)
            ├── .main-area           (flex row: sidebar + content)
            │   ├── .sidebar         (file explorer + DB list)
            │   └── .content-area    (split panels)
            └── .status-bar          (bottom status line)
    -->
    <div id="app">
      <!-- Rendered by src/main.ts -->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
