[package]
name = "web-ide"
version = "0.1.0"
description = "A full offline web IDE built with Tauri"
authors = ["web-IDE"]
edition = "2021"
rust-version = "1.77"
default-run = "web-ide"

[[bin]]
name = "web-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 — the core desktop bridge (webkit2gtk-4.1 on Linux)
tauri = { version = "2", features = ["devtools"] }

# Serialization / deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite via rusqlite with bundled feature (no system sqlite required)
rusqlite = { version = "0.31", features = ["bundled"] }

# File system change notifications (cross-platform)
notify = "6.1"

# Async runtime for file watcher events
tokio = { version = "1", features = ["full"] }

# Error handling helpers
anyhow = "1.0"

# Thread-safe mutable state wrapper
parking_lot = "0.12"

# Unique ID generation for tabs / sessions
uuid = { version = "1.6", features = ["v4"] }

# Timestamp helpers
chrono = { version = "0.4", features = ["serde"] }

# Hex encoding for BLOB values returned from SQLite
hex = "0.4"

# Native file / folder picker dialog (no GTK dependency issues)
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }

[features]
# This feature is used for production builds or when `devtools` feature is not desired.
custom-protocol = ["tauri/custom-protocol"]

