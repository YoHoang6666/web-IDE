name: Build Native IDE Skeleton

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  structure-check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure architecture workspace
        run: cmake -S . -B build -DWEBIDE_ENABLE_DESKTOP_APP=OFF -DWEBIDE_BUILD_TESTS=OFF

      - name: Validate generated targets
        run: cmake --build build --config Release
